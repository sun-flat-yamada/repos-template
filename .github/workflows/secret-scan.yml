name: "Secret Leak Scan"

on:
  push:
    branches: ["main", "fork/custom"]
  pull_request:
    branches: ["main", "fork/custom"]

# gitleaks-action reads the commits of a pull request and comments on findings.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: "Gitleaks Zero-Leak Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
