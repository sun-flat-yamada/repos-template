name: "CI Pipeline"

on:
  push:
    branches: ["main", "fork/custom"]
  pull_request:
    branches: ["main", "fork/custom"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate Codebase & Automation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax & Compilation Check
        run: |
          python -m py_compile scripts/apply-template.py scripts/install-hooks.py scripts/validate-filenames.py scripts/validate-frontmatter.py scripts/verify-fork-health.py .claude/hooks/permission-guard.py

      - name: AI Permission Policy Tests
        run: |
          python tests/test-permission-guard.py -v

      - name: Fork Health Script Tests
        run: |
          python tests/test-verify-fork-health.py -v

      - name: Front Matter Validation
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python scripts/validate-frontmatter.py
          python tests/test-validate-frontmatter.py -v

      - name: File Naming Convention Check
        run: |
          python scripts/validate-filenames.py

      - name: Template Engine Verification
        run: |
          python scripts/apply-template.py --help
          python scripts/apply-template.py --dry-run
